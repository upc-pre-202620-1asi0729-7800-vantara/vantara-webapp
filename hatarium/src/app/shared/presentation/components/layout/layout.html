<mat-sidenav-container class="sidenav-container">
  <mat-sidenav mode="side" opened class="sidenav">
    <div class="brand">
      <mat-icon>agriculture</mat-icon>
      <div>
        <strong>Hatarium</strong>
        <small>Gestión Ganadera</small>
      </div>
    </div>
    <mat-nav-list>
      @for (option of options; track option.labelKey) {
        @if (option.link) {
          <a mat-list-item [routerLink]="option.link" routerLinkActive="active">
            <mat-icon matListItemIcon>{{ option.icon }}</mat-icon>
            <span matListItemTitle>{{ option.labelKey | translate }}</span>
          </a>
        } @else {
          <mat-list-item class="disabled" aria-disabled="true">
            <mat-icon matListItemIcon>{{ option.icon }}</mat-icon>
            <span matListItemTitle>{{ option.labelKey | translate }}</span>
          </mat-list-item>
        }
      }
    </mat-nav-list>
    <div class="switcher">
      <app-language-switcher/>
    </div>
  </mat-sidenav>
  <mat-sidenav-content>
    <header class="topbar">
      <span class="topbar-title">Hatarium</span>
      <span class="spacer"></span>
      <a mat-icon-button routerLink="/notifications" aria-label="Notificaciones" class="bell-btn">
        <mat-icon>notifications</mat-icon>
        <span class="badge-dot"></span>
      </a>
      <button mat-stroked-button color="primary" (click)="signOut()" class="signout-btn">
        <mat-icon>logout</mat-icon>
        Cerrar sesión
      </button>
    </header>
    <router-outlet/>
  </mat-sidenav-content>
</mat-sidenav-container>
