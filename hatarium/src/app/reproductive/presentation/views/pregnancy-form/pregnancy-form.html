<mat-card>
  <mat-card-header>
    <mat-card-title>Registrar preñez</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline">
        <mat-label>ID del animal</mat-label>
        <input matInput formControlName="animalId" required>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>ID del ternero (opcional)</mat-label>
        <input matInput formControlName="calfId">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Fecha de confirmación</mat-label>
        <input matInput type="date" formControlName="confirmedOn" required>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Parto esperado</mat-label>
        <input matInput type="date" formControlName="expectedCalvingOn">
      </mat-form-field>
      <button mat-raised-button color="primary" type="submit">Confirmar preñez</button>
    </form>
  </mat-card-content>
</mat-card>
