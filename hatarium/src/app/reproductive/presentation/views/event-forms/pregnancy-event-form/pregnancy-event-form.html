<div class="form-overlay">
  <mat-card>
    <mat-card-header><mat-card-title>{{ 'forms.pregnancyTitle' | translate }}</mat-card-title></mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline"><mat-label>{{ 'forms.animalId' | translate }}</mat-label><input matInput formControlName="animalId" required></mat-form-field>
        <mat-form-field appearance="outline"><mat-label>{{ 'forms.calfId' | translate }}</mat-label><input matInput formControlName="calfId"></mat-form-field>
        <mat-form-field appearance="outline"><mat-label>{{ 'forms.confirmedOn' | translate }}</mat-label><input matInput type="date" formControlName="confirmedOn" required></mat-form-field>
        <mat-form-field appearance="outline"><mat-label>{{ 'forms.expectedCalvingOn' | translate }}</mat-label><input matInput type="date" formControlName="expectedCalvingOn"></mat-form-field>
        <div class="actions">
          <a mat-button routerLink="/reproductive">{{ 'forms.cancel' | translate }}</a>
          <button mat-raised-button color="primary" type="submit">{{ 'forms.submitPregnancy' | translate }}</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
