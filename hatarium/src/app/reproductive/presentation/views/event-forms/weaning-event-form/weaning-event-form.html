<div class="form-overlay">
  <mat-card>
    <mat-card-header><mat-card-title>{{ 'forms.weaningTitle' | translate }}</mat-card-title></mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline"><mat-label>{{ 'forms.pregnancyId' | translate }}</mat-label><input matInput formControlName="pregnancyId" required></mat-form-field>
        <mat-form-field appearance="outline"><mat-label>{{ 'forms.weanedOn' | translate }}</mat-label><input matInput type="date" formControlName="weanedOn" required></mat-form-field>
        <mat-form-field appearance="outline"><mat-label>{{ 'forms.weaningWeightKg' | translate }}</mat-label><input matInput formControlName="weaningWeightKg"></mat-form-field>
        <div class="actions">
          <a mat-button routerLink="/reproductive">{{ 'forms.cancel' | translate }}</a>
          <button mat-raised-button color="primary" type="submit">{{ 'forms.submitWeaning' | translate }}</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
