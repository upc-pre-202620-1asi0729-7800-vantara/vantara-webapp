<h1>Planes de suscripción</h1>
<div class="plans-grid">
  @for (plan of plans; track plan.name) {
    <mat-card>
      <mat-card-header><mat-card-title>{{ plan.name }}</mat-card-title></mat-card-header>
      <mat-card-content>
        <p class="price">{{ plan.price }} / mes</p>
        <p>{{ plan.animals }}</p>
        <a mat-raised-button color="primary" routerLink="/config/payments/method">Seleccionar plan</a>
      </mat-card-content>
    </mat-card>
  }
</div>
