<h1>Suscripción y pagos</h1>
<mat-card class="plan-card">
  <mat-card-header>
    <mat-card-title>Plan actual: Profesional</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>S/ 49.90 / mes · Activo</p>
    <a mat-raised-button color="primary" routerLink="/config/payments/plans">Ver planes</a>
  </mat-card-content>
</mat-card>
<h2>Historial de pagos</h2>
<mat-card>
  <mat-card-content>
    @for (payment of store.payments(); track payment.id) {
      <p>{{ payment.createdAt }} — {{ payment.concept }} — {{ payment.formattedAmount() }} — {{ payment.status }}</p>
    }
    <a mat-button routerLink="/config/payments/history">Ver todo</a>
  </mat-card-content>
</mat-card>
