<h1>Método de pago</h1>
<mat-card>
  <mat-card-content>
    <button mat-stroked-button type="button" (click)="generateRandomData()">Generar datos aleatorios</button>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline"><mat-label>Número de tarjeta</mat-label><input matInput formControlName="cardNumber" required></mat-form-field>
      <mat-form-field appearance="outline"><mat-label>Nombre del titular</mat-label><input matInput formControlName="cardHolder" required></mat-form-field>
      <mat-form-field appearance="outline"><mat-label>Fecha de vencimiento</mat-label><input matInput formControlName="expiry" placeholder="MM/AA" required></mat-form-field>
      <mat-form-field appearance="outline"><mat-label>CVV</mat-label><input matInput formControlName="cvv" required></mat-form-field>
      <div class="actions">
        <a mat-button routerLink="/config/payments/plans">Cancelar</a>
        <button mat-raised-button color="primary" type="submit">Guardar tarjeta</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
