<div class="notification">

  <h3>{{ notification.title }}</h3>

  <p>
    {{ notification.description }}
  </p>

  <small>
    {{ notification.formattedDate() }}
  </small>

  <p>
    Estado: {{ notification.status }}
  </p>

  @if (!notification.isRead()) {
    <button (click)="markAsRead()">
      Marcar como leída
    </button>
  }

</div>
