<section class="notification-center">

  <div class="header">

    <h2>Notificaciones</h2>

    <app-notification-badge
      [unreadCount]="store.unreadCount()">
    </app-notification-badge>

  </div>


  <select
    #typeFilter
    (change)="filterByType(typeFilter.value)">

    <option value="">
      Todas
    </option>

    <option value="HEALTH_ALERT">
      Salud
    </option>

  </select>


  @if (store.loading) {

    <p>Cargando notificaciones...</p>

  } @else {

    @if (store.errorMessage) {

      <p class="error">
        {{ store.errorMessage }}
      </p>

    }

    <app-notification-list
      [notifications]="store.visibleNotifications()"
      (markRead)="markAsRead($event)">
    </app-notification-list>

  }

</section>
